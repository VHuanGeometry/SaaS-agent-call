server:
  port: 8000

spring:
  application:
    name: vhuan-gateway
  # Nacos 服务发现（gateway 自身注册到 Nacos）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: vhuan
      config:
        server-addr: 127.0.0.1:8848
        namespace: vhuan
        group: DEFAULT_GROUP
        file-extension: yaml
    # Spring Cloud Gateway 路由配置（显式 routes 已迁移至 Nacos，不依赖 discovery locator）
    gateway:
      discovery:
        locator:
          enabled: false  # 关闭默认的自动服务发现路由，路由统一由 Nacos vhuan-gateway.yaml 提供
      # ── 全局 HTTP 客户端配置（Reactor Netty）
      # connect-timeout / response-timeout 给首次冷启动（LoadBalancer 拉取服务列表 +
      # HTTP 连接池初始化）留出充足时间，避免"第一遍超时第二遍才通"的问题。
      httpclient:
        connect-timeout: 10000    # 建立 TCP 连接的超时时间（毫秒），默认较短，首请求可能不够
        response-timeout: 30s     # 读取响应的超时时间
        pool:
          type: fixed              # 固定大小连接池
          max-connections: 50      # 最大连接数
          acquire-timeout: 10000   # 从连接池获取连接的超时时间（毫秒）
      # ── 路由 / CORS 配置已迁移至 Nacos（vhuan-gateway.yaml，热更新免重启）──

    # Sentinel 限流
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      # 租户维度限流规则从 Nacos 动态加载（rule-type=gw-flow，网关流控规则）
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: vhuan
            data-id: vhuan-gateway-sentinel
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
  config:
    import:
      # 通过 spring.config.import 显式声明要加载的 Nacos 配置源
      # （shared-configs/extension-configs 仅 bootstrap 模式生效，import 模式不会加载）
      # 应用自身配置：vhuan-gateway.yaml
      - optional:nacos:${spring.application.name}.yaml
      # 共享配置：gateway 与 auth 共用同一份 jwt 密钥
      - optional:nacos:vhuan-shared.yaml


# Actuator：暴露健康检查与网关路由元信息端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

# 日志级别已迁移至 Nacos（vhuan-gateway.yaml 的 logging.level，动态调整免重启）



# 网关安全配置
gateway:
  security:
    # 服务间内部调用的共享 Token（/api/internal/** 校验用，由环境变量注入）
    # 生产环境必须通过环境变量 INTERNAL_CALL_TOKEN 注入，未配置时内部调用将被拒绝
    internal-call-token: ${INTERNAL_CALL_TOKEN:}
    # 鉴权白名单已迁移至 Nacos（vhuan-gateway.yaml 的 gateway.security.whitelist-paths）
graceful-response:
  response-style: 1
  # 是否打印异常日志，默认为false
  print-exception-in-global-advice: true
  # 设置是否将原生异常错误信息detailMessage字段填充到Response的msg中
  origin-exception-using-detail-message: true
  exclude-packages:
    - springfox.**
    - org.springdoc.**
    - io.swagger.**
  exclude-urls:
    - /**/api-docs/**
    - /**/doc.html